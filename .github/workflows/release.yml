name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.arch }}
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04

          - arch: arm64
            runner: ubuntu-24.04-arm

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install Rust
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1

      - name: Build release
        run: cargo build --release --locked

      - name: Prepare binary
        run: |
          mkdir -p dist

          cp target/release/tinkiva-docker-manager \
            dist/tinkiva-docker-manager-linux-${{ matrix.arch }}

          chmod +x \
            dist/tinkiva-docker-manager-linux-${{ matrix.arch }}

      - name: Generate SHA256
        run: |
          cd dist
          sha256sum tinkiva-docker-manager-linux-${{ matrix.arch }} \
            > tinkiva-docker-manager-linux-${{ matrix.arch }}.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tinkiva-docker-manager-linux-${{ matrix.arch }}
          path: dist/*

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-24.04

    steps:
      - name: Download binaries
        uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true

      - name: Show files
        run: ls -lah dist

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "${{ github.ref_name }}" \
            dist/* \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            --verify-tag
